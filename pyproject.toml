[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cb-agent"
version = "0.1.0"
description = "一个轻量、可读、可拆解的 LLM Agent 框架"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# core：跑通 REPL（agent + context + tools 原生工具 + MCP）所需的最小集合
# 不包含本地 embedding、多模态、向量库、图库、PDF skill、外部搜索的依赖
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "tiktoken>=0.7",
    "fastmcp>=2.0",
    "requests>=2.31",
    "colorama>=0.4.6",        # Windows 终端 ANSI 兜底
    "pyyaml>=6.0",            # Skill SKILL.md frontmatter
    "bashlex>=0.18",          # BashTool 命令 AST 解析（POSIX shell）
]

# full：完整能力，把所有可选模块的依赖一并装上
# 包含 torch / sentence-transformers，体积 GB 级，按需安装
[project.optional-dependencies]
full = [
    # 本地 embedding / NLP
    "sentence-transformers>=2.7",
    "torch>=2.0",
    "transformers>=4.40",
    "scikit-learn>=1.3",
    "spacy>=3.7",

    # 多模态 RAG
    "Pillow>=10.0",
    "librosa>=0.10",
    "markitdown>=0.0.1",
    "langdetect>=1.0.9",

    # 向量库 / 图库
    "zvec>=0.4",
    "qdrant-client>=1.9",
    "neo4j>=5.20",

    # PDF skill 脚本
    "pdfplumber>=0.11",
    "pdf2image>=1.17",
    "pypdf>=4.0",

    # Web 搜索
    "tavily-python>=0.3",
    "google-search-results>=2.4",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["test*", "venv*", "外部代码*", "note*", "__pycache__*"]
