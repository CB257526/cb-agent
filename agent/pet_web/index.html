<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cb-agent pet</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: rgba(0, 0, 0, 0) !important;
        user-select: none;
      }

      #stage {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: rgba(0, 0, 0, 0) !important;
      }

      #background,
      #live2dCanvas,
      #spritesheetCanvas,
      #overlays {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0) !important;
      }

      #background {
        object-fit: cover;
        pointer-events: none;
      }

      #overlays img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        pointer-events: none;
      }

      #loading {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        color: white;
        background: transparent;
        font: 14px system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="background" alt="" />
      <canvas id="live2dCanvas"></canvas>
      <canvas id="spritesheetCanvas"></canvas>
      <div id="overlays"></div>
      <div id="loading">Loading pet...</div>
    </div>
    <script src="./js/live2dcubismcore.min.js"></script>
    <script src="./live2d_renderer.js"></script>
  </body>
</html>
